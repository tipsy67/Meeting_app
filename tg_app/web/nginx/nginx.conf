http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;  # Для неизвестных файлов

    server {
        listen 80;
        server_name 127.0.0.1  wau1n9-213-87-151-31.ru.tuna.am;
        root /usr/share/nginx/html;

        location / {
            index index.html;
            try_files $uri $uri/ =404;
        }

        location /static/ {
#             expires 1d;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}

events {}